<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Geoestadístico | Análisis de Tasas</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@400;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="map-overlay-header">
        <div class="header-content">
            <h1 id="mainTitle">Análisis Geográfico de Tasas</h1>
        </div>
    </div>

    <div class="controls">
        <label>Mapa Base
            <select id="baseMapSelect">
                <option value="dark">Carto Dark (Oscuro)</option>
                <option value="streets">OpenStreetMap (Color)</option>
                <option value="satellite">Satélite</option>
            </select>
        </label>

        <div class="separator"></div>
        
        <button id="btnCargarGeoJSON" class="map-button">
            Cargar Datos GeoJSON
        </button>
        
        <div class="separator"></div>

        <label>Método de Clasificación
            <select id="classificationSelect">
                <option value="quintile">Quintiles (Equitativo)</option>
                <option value="equal">Intervalos Iguales</option>
                <option value="jenks">Natural Breaks (Jenks)</option>
            </select>
        </label>

        <label>Paleta de Colores
            <select id="paletteSelect">
                <option value="blues">Azules</option>
                <option value="reds">Rojos</option>
                <option value="greens">Verdes</option>
                <option value="purples">Púrpuras</option>
                <option value="yellows">Naranjas</option>
            </select>
        </label>

        <div class="separator"></div>

        <label>Buscador de Unidades
            <select id="labelSelect">
                <option value="">Seleccione Unidad...</option>
            </select>
        </label>

        <div id="infoCard" class="info-card" style="display:none;">
            <p id="detailNome"><b>Unidad:</b> --</p>
            <p id="detailTaxa"><b>Valor:</b> --</p>
        </div>
    </div>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <script src="script.js"></script>
</body>
</html>
